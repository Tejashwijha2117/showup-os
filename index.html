const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=x=>x==null||!Number.isFinite(Number(x))?'—':Number(x).toLocaleString('en-IN',{maximumFractionDigits:1}), money=x=>x==null?'—':'₹'+num(x), pct=x=>x==null||!Number.isFinite(Number(x))?'—':(x*100).toFixed(1)+'%', tag=x=>`<span class="tag ${x==='STOP'?'stop':x==='CHANGE'||x==='TEST'?'warn':''}">${esc(x)}</span>`, card=(label,v,detail='')=>`<div class="card"><small>${esc(label)}</small><div class="kpi">${esc(v)}</div><small>${esc(detail)}</small></div>`, bar=(n,v,max)=>`<div class="row"><span>${esc(n)}</span><b>${num(v)}</b></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,v/max*100))}%"></i></div>`, table=(heads,rows)=>`<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
let state,hist,page='Overview',day='2025-04-20',filter='all';const pages=['Overview','Funnel intelligence','Campaigns','Execution','Scenario lab'];const signals=['Reconfirmation uplift (pp)','Incremental CPR (₹)','Registrations per campus','Registration uplift (pp)','Offer acceptance (%)'];const pilots=[2000,2000,5000,2000,1000];async function api(path,body){let r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error||JSON.stringify(d.detail));return d}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}async function load(){try{state=await api('state');hist=await api('history?date='+day+'&campaign='+filter);render()}catch(e){$('#content').textContent=e.message}}function navigate(p){page=p;render()}function render(){if(!state||!hist)return; if(window.Chart){Object.values(Chart.instances).forEach(c=>c.destroy())};$('#title').textContent=page;$('#nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="navigate('${p}')">${p}</button>`).join('');let b=state.forecasts.base,s=hist.summary,h=state.forecasts;let filters=`<div class="row"><label>Historical snapshot (IST)<input type="date" min="2025-01-15" max="2025-04-20" value="${day}" onchange="day=this.value;load()"></label><label>Attribution campaign<select onchange="filter=this.value;load()"><option value="all">All campaigns</option>${hist.campaigns.map(c=>`<option value="${esc(c.campaign_id)}" ${filter===c.campaign_id?'selected':''}>${esc(c.campaign_name)}</option>`).join('')}</select></label></div>`;let warnings=(!b.feasible?`<div class="notice">Plan violates at least one resource or capacity constraint. Reallocate before scaling. Budget headroom ${money(b.budget_gap)} · team headroom ${num(b.hours_gap)} h.</div>`:'');
if(page==='Overview')$('#content').innerHTML=`<div class="row"><h3>Next edition · planning forecast</h3><small>${num(state.settings.weeks)} weeks remaining (scenario input)</small></div><div class="grid">${card('Base forecast',num(b.forecast),'Target 2,420 · gap '+num(Math.max(0,2420-b.forecast)))}${card('Stretch forecast',num(h.stretch.forecast),'Target 2,600')}${card('Downside forecast',num(h.downside.forecast),'Planning sensitivity')}${card('Planned marketing',money(b.planned_budget),pct(b.planned_budget/state.settings.budget)+' allocated')}${card('Simulated bet spend',money(state.campaigns.reduce((a,c)=>a+c.spend,0)),'Manually recorded; excludes historical and retained spend')}${card('Simulated verified records',num(state.simulated_actual),'Actual gap to base target: '+num(Math.max(0,2420-state.simulated_actual))+' · synthetic ledger only')}</div>${warnings}<div class="two"><div class="card"><h3>Growth waterfall</h3>${bar('Historical reference',2050,Math.max(2714,b.capacity))}${bar('Retained after paid reduction',2050-b.paid_loss,Math.max(2714,b.capacity))}${bar('Forecast after new bets',b.forecast,Math.max(2714,b.capacity))}<small>New bet contribution +${num(b.contribution)} · capacity ${num(b.capacity)}</small></div><div class="card"><h3>Decision queue</h3>${state.campaigns.map(c=>`<div class="row" style="margin:12px 0"><span>${esc(c.name)}</span>${tag(c.decision)}</div>`).join('')}<button onclick="navigate('Campaigns')">Review campaigns</button></div></div><div class="card"><h3>Historical evidence · read-only</h3><p class="muted">North Star: verified unique external attendees, deduplicated by person ID.</p>${filters}<p class="muted">Targets are event-wide even when campaign filter is applied.</p><div class="grid">${card('Verified unique attendees',num(s.attendees),'Event target '+num(s.target.unique_external_visitors_goal)+' · gap '+num(Math.max(0,(s.target.unique_external_visitors_goal||0)-s.attendees)))}${card('Registered people',num(s.registered),'Show-up '+pct(s.showup))}${card('Net spend',money(s.spend),'Posted debits less credits')}${card('Attributed attendee CPA',money(s.cpa),'Registered attendee denominator')}${card('Budget utilization',pct(s.spend/s.target.marketing_budget_inr),'Historical net spend / effective budget')}${card('Lead → registration',pct(s.lead_conversion),'Historical person-level conversion')}</div></div><div class="card"><h3>Historical growth trend</h3>${trendChart()}</div><div class="card"><h3>Top alerts & next actions</h3>${alerts()}</div>`;
if(page==='Funnel intelligence')$('#content').innerHTML=`<div class="card">${filters}<p class="muted">Historical source only · as of end of selected day · first-touch attribution</p></div><div class="two"><div class="card"><h3>Person-level funnel</h3>${bar('Identified external people',s.identified,Math.max(1,s.identified))}${bar('Unique registered',s.registered,Math.max(1,s.identified))}${bar('Confirmed',s.confirmed,Math.max(1,s.identified))}${bar('Registered attendees',s.registered_attendees,Math.max(1,s.identified))}<p>Walk-ins ${num(s.walkins)} · registration conversion ${pct(s.lead_conversion)} · confirmation rate ${pct(hist.diagnostics.confirmation_rate)} · registered show-up ${day<'2025-04-13'?'Not final':pct(s.showup)}</p><small>Before event end, zero attendance is not evidence of a no-show. Final lead count includes walk-ins.</small></div><div class="card"><h3>Anonymous platform events</h3>${bar('Impressions',s.impressions,Math.max(1,s.impressions))}${bar('Summed reported reach',s.reach,Math.max(1,s.impressions))}${bar('Clicks',s.clicks,Math.max(1,s.impressions))}${bar('Landing sessions',s.sessions,Math.max(1,s.impressions))}<small>CTR ${pct(s.ctr)}. Summed reach is not globally unique.</small></div></div><div class="card"><h3>Historical campaign comparison</h3>${table(['Campaign','Leads','Registrations','Attendees','Net spend','CPA','Show-up'],hist.campaigns.map(c=>[esc(c.campaign_name),num(c.identified),num(c.registered),num(c.attendees),money(c.spend),money(c.cpa),pct(c.showup)]))}</div><div class="card"><h3>Registration trend · snapshot</h3>${trendChart()}${table(['Date','Identified','Registered','Confirmed','Attended','Spend','Budget'],hist.trend.map(t=>[esc(t.date),num(t.identified),num(t.registered),num(t.confirmed),num(t.attendees),money(t.spend),money(t.target.marketing_budget_inr)]))}</div>`;
if(page==='Funnel intelligence')$('#content').innerHTML+=`<div class="two"><div class="card"><h3>Funnel leakage & bottleneck</h3>${table(['Stage','People'],hist.diagnostics.leakage.map(x=>[esc(x.name),num(x.count)]))}<p>Largest measurable leakage: ${esc(leakage(s))}</p></div><div class="card"><h3>Acquisition cohort comparison</h3>${cohorts()}</div></div><div class="card"><h3>Metric definitions & source lineage</h3>${table(['Metric','Calculation / source'],[['Verified attendees','Distinct external person IDs; verified admitted check-ins during event (checkins + people + event)'],['Registered','Distinct external people registered by snapshot (registrations)'],['Confirmed','Latest eligible history state per registration (registration_history)'],['Conversion','Unique downstream / upstream people; zero denominator = unavailable'],['CPA','Net posted marketing spend / attributed registered attendees (marketing)'],['Reach','Sum of reported platform reach; not unique across platforms'],['Cohorts','First acquisition campaign, not causal attribution']])}</div>`;
if(page==='Campaigns')$('#content').innerHTML=`${warnings}<div class="card"><div class="row"><h3>Growth bets · editable plan</h3><button onclick="editCampaign()">+ New campaign</button></div><small>Planned budget and simulated spend are separate. Pilot results are manually entered, not historical facts.</small>${table(['Campaign / owner','Budget / spend','Forecast / simulated actual','Projected iCPA','Pilot decision','Edit'],state.campaigns.map(c=>[`<b>${esc(c.name)}</b><small>${esc(c.owner)} · ${esc(c.status)} · W${esc(c.weeks)}<br>${esc(c.segment)} · ${esc(c.objective)}</small>`,money(c.budget)+'<br><small>Simulated spend '+money(c.spend)+'</small>',num(c.projected.contribution)+' / '+num(c.actual),money(c.projected.projected_cpa),tag(c.decision)+`<br><small>${esc(signals[c.bet_index]||'Custom pilot')} · n=${num(c.sample)} · ${esc(state.experiments.find(e=>e.campaign_id===c.id)?.status||'Planned')}</small><br><button class="mini secondary" onclick="editExperiment('${esc(c.id)}')">Experiment</button>`,`<button class="mini secondary" onclick="editCampaign('${esc(c.id)}')">Edit</button>`]))}</div><div class="card"><h3>Historical campaign spend · read-only</h3>${table(['Campaign','Historical net spend','Attributed attendance'],hist.campaigns.map(c=>[esc(c.campaign_name),money(c.spend),num(c.registered_attendees)]))}</div><div class="card"><h3>Simulated outcome ledger</h3><p class="muted">Record a synthetic person ID. Duplicate IDs update the same record, never inflate unique attendance.</p><form id="outcome" onsubmit="saveOutcome(event)"><div class="fields"><label>Person key<input name="person_key" required placeholder="SIM-001"></label><label>Campaign<select name="campaign_id">${state.campaigns.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><label>Verified<select name="verified"><option value="1">Yes</option><option value="0">No</option></select></label></div><button>Save outcome</button></form></div>`;
if(page==='Execution')$('#content').innerHTML=`<div class="card"><div class="row"><h3>Action tracker</h3><button onclick="editTask()">+ New task</button></div>${table(['Task / completion criteria','Campaign','Owner','Due','Priority','Status','Edit'],state.tasks.map(t=>[`<b>${esc(t.title)}</b><small>${esc(t.criteria)}<br>${esc(t.impact)}<br>Insight: ${esc(t.insight||'—')}</small>`,esc(state.campaigns.find(c=>c.id===t.campaign_id)?.name),esc(t.owner),esc(t.deadline),esc(t.priority),tag(t.status),`<button class="mini secondary" onclick="editTask('${esc(t.id)}')">Edit</button>`]))}</div><div class="card"><h3>Recent audit history</h3>${table(['Time (UTC)','Action','Entity'],state.audit.slice().reverse().map(a=>[esc(a.at),esc(a.action),esc(a.entity)]))}</div>`;
if(page==='Scenario lab')$('#content').innerHTML=`${warnings}<div id="preview-results" class="grid">${forecastCards(h)}</div><div class="card"><h3>Scenario controls · preview only</h3><p class="muted">Changes are recalculated by the server. Conversion and show-up rates are planning sensitivities (0–1; references 0.80 and 0.6875). They change eligible incremental bets relative to the locked plan; factors default to 1. Preview does not modify the live plan.</p><form id="scenario-form" class="scenario-controls" oninput="queuePreview()" onsubmit="event.preventDefault();runPreview()"><div class="fields">${Object.entries(state.settings).filter(([k])=>!['conversion_factor','showup_factor'].includes(k)).map(([k,v])=>`<label>${esc(k.replaceAll('_',' '))}<input required type="number" step="any" min="0" ${['peak_share','arrival_share','conversion_rate','showup_rate'].includes(k)?'max="1"':''} name="${k}" value="${v}"></label>`).join('')}<label>Campaign<select name="campaign_id" onchange="this.form.campaign_budget.value=state.campaigns.find(c=>c.id===this.value).budget;queuePreview()">${state.campaigns.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><label>Campaign budget (₹)<input type="number" min="0" name="campaign_budget" value="${state.campaigns[0].budget}"></label></div><button>Recalculate now</button> <button type="button" class="secondary" onclick="saveScenario()">Save scenario snapshot</button> <button type="button" onclick="applyPlan()">Apply to live plan</button></form><p id="preview-message" role="status" class="muted"></p></div><div class="card"><h3>Contribution by scenario</h3><div id="preview-detail">${forecastDetails(h)}</div></div><div class="card"><h3>Saved scenarios</h3>${table(['Name','Created (UTC)','Compare'],state.scenarios.map(x=>[esc(x.name),esc(x.created_at),`<button class="mini secondary" onclick="readScenario('${esc(x.id)}')">View</button>`]))}</div>`;

if(page==='Overview'||page==='Funnel intelligence') drawTrend(); if(!$('#drawer').hidden) openCopilot();
}
function field(k,v,type='text',opts){return `<label>${esc(k.replaceAll('_',' '))}${opts?`<select name="${k}">${opts.map(o=>`<option ${String(v)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${k}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(v)}" ${k==='name'||k==='title'?'required':''}>`}</label>`}function modal(title,fields,handler){$('#modal').innerHTML=`<div class="row"><h3>${esc(title)}</h3><button class="secondary mini" onclick="document.querySelector('#modal').close()">Close</button></div><form id="modalform"><div class="fields">${fields}</div><button>Save changes</button></form>`;$('#modalform').onsubmit=async e=>{e.preventDefault();try{await handler(Object.fromEntries(new FormData(e.target)));$('#modal').close();await load();toast('Saved successfully')}catch(e){toast(e.message)}};$('#modal').showModal()}
function editCampaign(id){let c=state.campaigns.find(x=>x.id===id)||{name:'',owner:'',segment:'',objective:'',status:'Planned',budget:0,spend:0,expected:0,hours:0,sample:0,signal:'',guardrail:1,weeks:''};let fields=['name','owner','segment','objective','weeks'].map(k=>field(k,c[k])).join('')+field('status',c.status,'text',['Planned','Testing','Active','Paused','Stopped','Completed'])+['budget','spend','expected','hours','sample','signal'].map(k=>field(k,c[k],'number')).join('')+field('guardrail',c.guardrail,'text',[1,0])+`<small>Signal: ${esc(signals[c.bet_index]||'Custom')} · guardrail 1=pass, 0=fail. Expected is the full-funding base contribution.</small>`;modal('Edit campaign',fields,x=>api('campaigns',{...x,id,guardrail:Number(x.guardrail)}))}
function editTask(id){let t=state.tasks.find(x=>x.id===id)||{campaign_id:state.campaigns[0]?.id,title:'',owner:'',priority:'Medium',deadline:'2027-03-01',status:'Open',impact:'',criteria:''};let fields=['title','owner','impact','criteria','insight'].map(k=>field(k,t[k])).join('')+`<label>Campaign<select name="campaign_id">${state.campaigns.map(c=>`<option value="${esc(c.id)}" ${t.campaign_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`+field('deadline',t.deadline,'date')+field('priority',t.priority,'text',['High','Medium','Low'])+field('status',t.status,'text',['Open','In progress','Done']);modal('Edit task',fields,x=>api('tasks',{...x,id}))}
async function saveOutcome(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));try{await api('outcomes',{...x,verified:x.verified==='1'});await load();toast('Outcome saved')}catch(e){toast(e.message)}}async function saveSettings(e){e.preventDefault();try{await api('settings',Object.fromEntries(new FormData(e.target)));await load();toast('Forecast recalculated')}catch(e){toast(e.message)}}
function trendChart(){return '<div class="chart-wrap"><canvas id="trend" aria-label="Historical trend chart"></canvas></div><div class="chart-fallback" id="chart-fallback"></div>'}
function drawTrend(){const el=$('#trend');if(!el)return;if(!window.Chart){$('#chart-fallback').innerHTML='Chart library unavailable. Historical values remain available.'+table(['Date','Identified','Registered','Confirmed','Attendees'],hist.trend.map(t=>[esc(t.date),num(t.identified),num(t.registered),num(t.confirmed),num(t.attendees)]));el.parentElement.style.display='none';return}new Chart(el,{type:'line',data:{labels:hist.trend.map(t=>t.date.slice(5)),datasets:[['identified','Identified','#3979BD'],['registered','Registered','#172B4D'],['confirmed','Confirmed','#D97706'],['attendees','Attendees','#0D9488']].map(([k,label,borderColor])=>({label,borderColor,data:hist.trend.map(t=>t[k]),tension:.25,pointRadius:3}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}})}
function leakage(s){let x=hist.diagnostics.bottleneck;return x.name+' · '+num(x.count)}
function cohorts(){return table(['Cohort','Registrants','Attendees','CPA','Show-up'],hist.diagnostics.cohorts.map(c=>[esc(c.name),num(c.registered),num(c.attendees),money(c.cpa),day<'2025-04-13'?'Not final':pct(c.showup)]))}
function alerts(){let b=state.forecasts.base;let a=[];if(!b.feasible)a.push('Resource or venue constraint breached — review Scenario Lab before scaling.');if(b.forecast<2420)a.push('Base forecast shortfall: '+num(2420-b.forecast)+' — investigate campaign decisions.');state.campaigns.filter(c=>c.decision==='STOP'||c.decision==='CHANGE').forEach(c=>a.push(c.name+': '+c.decision+' — review pilot evidence and uncommitted allocation.'));if(!a.length)a.push('No constraint breach. Collect pilot evidence before releasing conditional funding.');return a.map(x=>`<p class="notice">${esc(x)}</p>`).join('')}
function openCopilot(){if(!state||!hist)return;let d=$('#drawer');let selected=$('#copilot-campaign')?.value||'all';d.hidden=false;d.innerHTML=`<div class="row"><h3>AI Growth Copilot</h3><button class="secondary" onclick="document.querySelector('#drawer').hidden=true">Close</button></div><span class="pill badge-f">Backend LLM connection pending</span><p>Phase 4 context only. No AI responses are generated.</p><label>Active planning campaign<select id="copilot-campaign" onchange="showContext()"><option value="all">All growth bets</option>${state.campaigns.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><div id="copilot-context"></div>`;$('#copilot-campaign').value=selected;showContext()}
function showContext(){let c=state.campaigns.find(x=>x.id===$('#copilot-campaign').value);let s=state.settings;$('#copilot-context').innerHTML=`<div class="card"><h3>Current context</h3><p>Screen: ${esc(page)}</p><p>Historical date: ${esc(day)} IST</p><p>Historical campaign: ${esc(hist.campaigns.find(c=>c.campaign_id===filter)?.campaign_name||'All')}</p><p>Planning campaign: ${esc(c?.name||'All')}</p><p>Budget: ${money(s.budget)} · ${num(s.weeks)} weeks · ${num(s.hours)} hours</p><p>Venue occupancy: ${num(s.occupancy)} · daily limit: ${num(s.daily)} · peak share: ${pct(s.peak_share)} · dwell: ${num(s.dwell)}h</p><p>Base forecast: ${num(state.forecasts.base.forecast)}</p><p>Conversion sensitivity: ${pct(s.conversion_rate)} · show-up sensitivity: ${pct(s.showup_rate)}</p><p class="muted">Read tools available: /api/state, /api/history, /api/preview. No AI writes enabled.</p></div>`}
function editExperiment(id){let e=state.experiments.find(x=>x.campaign_id===id);modal('Experiment · '+state.campaigns.find(c=>c.id===id).name,field('hypothesis',e.hypothesis)+field('method',e.method)+field('status',e.status,'text',['Planned','Running','Complete'])+field('signal',e.signal,'number')+field('sample',e.sample,'number')+field('guardrail',e.guardrail,'text',[1,0])+`<small>${esc(e.metric)} · minimum sample ${num(e.minimum_sample)}</small>`,x=>api('experiments',{...x,campaign_id:id}))}
function forecastCards(h){return Object.entries(h).map(([k,v])=>card(k+' forecast',num(v.forecast),'Raw demand '+num(v.raw)+(v.feasible?' · feasible':' · constraint breach'))).join('')+card('Operational ceiling',num(h.base.capacity),'Assumed, not safety-certified')}
function forecastDetails(h){return table(['Bet','Downside','Base','Stretch'],h.base.details.map(c=>[esc(c.name),...['downside','base','stretch'].map(k=>num(h[k].details.find(d=>d.id===c.id).contribution))]))}
function scenarioPayload(){let x=Object.fromEntries(new FormData($('#scenario-form')));let {campaign_id,campaign_budget,...settings}=x;return {settings,campaign_id,campaign_budget}}
let previewTimer,previewSeq=0;function queuePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(runPreview,200)}async function runPreview(){let seq=++previewSeq;try{let p=await api('preview',scenarioPayload());if(seq!==previewSeq||page!=='Scenario lab')return;$('#preview-results').innerHTML=forecastCards(p.forecasts);$('#preview-detail').innerHTML=forecastDetails(p.forecasts);$('#preview-message').textContent='Preview updated · live plan unchanged · budget headroom '+money(p.forecasts.base.budget_gap)+' · team headroom '+num(p.forecasts.base.hours_gap)+'h'}catch(e){if($('#preview-message'))$('#preview-message').textContent=e.message}}
async function applyPlan(){if(!confirm('Apply these planning assumptions and selected campaign budget to the live plan? Historical data will remain unchanged.'))return;try{await api('plan',scenarioPayload());await load();toast('Live plan updated')}catch(e){toast(e.message)}}
async function saveScenario(){let name=prompt('Name this scenario');if(!name)return;try{await api('scenarios',{...scenarioPayload(),name});await load();toast('Scenario saved')}catch(e){toast(e.message)}}async function readScenario(id){try{let p=await api('scenarios/'+id);$('#preview-results').innerHTML=forecastCards(p.forecasts);$('#preview-detail').innerHTML=forecastDetails(p.forecasts);$('#preview-message').textContent='Saved snapshot: '+p.name+' · live plan unchanged'}catch(e){toast(e.message)}}
load();
</script></body></html>
